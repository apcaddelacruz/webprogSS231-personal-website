<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 20px;
        }

        #about-me {
            max-width: 1200px;
            margin: 0 auto;
        }

        #about-me h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        #about-me p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Horizontal Gallery */
        .image-gallery {
            display: flex;
            overflow-x: scroll; /* Allows horizontal scrolling */
            gap: 20px;
            margin-top: 20px;
        }

        .image-gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Personal Gallery</h1>
    </header>

    <main id="app">
        <section id="about-me">
            <h2>About Me</h2>
            <p><strong>Name:</strong> Abrech D. Dela Cruz</p>
            <p><strong>Age:</strong> 20 years old</p>
            <p><strong>University:</strong> Asia Pacific College</p>
            <p><strong>Education and Achievements:</strong> Graduated elementary and senior high school and currently a sophomore</p>
            <p><strong>Goals in Life:</strong> To have a successful career path</p>

            <!-- Image Gallery -->

                <img :src="photoUrl4" alt="Personal Photo 4">
                <img :src="photoUrl5" alt="Personal Photo 5">
            </div>
        </section>
    </main>

    <footer>
